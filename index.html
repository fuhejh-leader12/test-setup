<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>考場布置進度板</title>
<style>
  :root{
    --bg:#fff8ef; --card:#ffffff; --ink:#3b2f2a; --muted:#8a7a70;
    --line:#f0e0cf; --accent:#f08a24; --accent-soft:#ffe9d0;
    --ok:#2e9e5b; --ok-soft:#dff5e7; --ok-deep:#c3ecd3; --ok-dark:#1e7d46;
    --warn:#e5484d; --warn-soft:#ffe8e8;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
    -webkit-tap-highlight-color:transparent}
  header{background:var(--accent);color:#fff;padding:14px 16px 0;position:sticky;top:0;z-index:5;
    box-shadow:0 2px 8px rgba(0,0,0,.12)}
  header h1{margin:0 0 10px;font-size:20px;letter-spacing:1px}
  .tabs{display:flex;gap:6px}
  .tab{flex:1;border:0;padding:12px 8px;font-size:16px;font-weight:700;border-radius:12px 12px 0 0;
    background:rgba(255,255,255,.28);color:#fff;cursor:pointer}
  .tab.on{background:var(--bg);color:var(--accent)}
  main{max-width:900px;margin:0 auto;padding:14px 12px 80px}
  .status{font-size:13px;color:var(--muted);margin:2px 2px 10px}
  .status.err{color:var(--warn);font-weight:700}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}
  .card.alert{border-color:var(--warn);background:#fffafa}
  .card.me{border-color:var(--accent);border-width:2px}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .stat{text-align:center;border-radius:12px;padding:8px 4px;background:var(--ok-soft)}
  .stat .big{font-size:30px;font-weight:800;color:var(--ok);line-height:1.1}
  .stat .sub{font-size:12px;color:var(--muted)}
  .stat.c2{background:var(--ok-deep)} .stat.c2 .big{color:var(--ok-dark)}
  .stat.c3{background:var(--warn-soft)} .stat.c3 .big{color:var(--warn)}
  .stat.c3.zero{background:#f6f2ee} .stat.c3.zero .big{color:var(--muted)}
  .bar{height:12px;background:var(--accent-soft);border-radius:99px;overflow:hidden;margin-top:10px;position:relative}
  .bar>i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .4s;position:absolute;left:0;top:0}
  .bar>i.b2{background:var(--ok-dark)}
  .bld{margin:0 0 4px;font-size:17px;font-weight:800;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .bld small{font-weight:600;color:var(--muted);font-size:13px}
  .floor{margin-top:10px}
  .floor h3{margin:0 0 6px;font-size:14px;color:var(--muted);font-weight:700}
  .allh{margin:18px 2px 8px;font-size:15px;color:var(--muted)}
  .rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:8px}
  .room{border:2px solid var(--line);background:#fffdf9;border-radius:14px;padding:10px 6px;text-align:center;
    font:inherit;color:inherit;cursor:pointer;min-height:96px;position:relative}
  .room .no{font-size:13px;color:var(--muted)}
  .room .no b{font-size:24px;color:var(--ink);margin-left:2px}
  .room .cls{font-size:14px;margin-top:2px}
  .room .st{font-size:13px;margin-top:4px;font-weight:700;color:var(--accent)}
  .room .who{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.4}
  .room.done{background:var(--ok-soft);border-color:var(--ok)}
  .room.done .st{color:var(--ok)}
  .room.checked{background:var(--ok-deep);border-color:var(--ok-dark)}
  .room.checked .st{color:var(--ok-dark)}
  .room.issue{border-color:var(--warn);box-shadow:0 0 0 2px var(--warn-soft)}
  .room .flag{position:absolute;top:4px;right:6px;font-size:16px}
  .room .note{font-size:12px;color:var(--warn);margin-top:4px;line-height:1.35;word-break:break-all;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .todo{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .chip{background:var(--accent-soft);border-radius:99px;padding:6px 12px;font-weight:700;font-size:14px;cursor:pointer}
  .chip.g{background:var(--ok-soft)}
  .issues{margin-top:8px;display:grid;gap:8px}
  .iss{border:1px solid var(--warn);background:#fff;border-radius:12px;padding:10px;cursor:pointer;font-size:15px;line-height:1.5}
  .iss b{color:var(--warn)}
  .bsum{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
  .bsum .it{border:1px solid var(--line);border-radius:12px;padding:10px}
  .bsum .it b{display:flex;justify-content:space-between;font-size:15px}
  .bsum .it small{color:var(--muted);font-size:13px}
  .bsum .it.full{background:var(--ok-soft);border-color:var(--ok)}
  .hint{color:var(--muted);font-size:14px;margin:0 2px 12px;line-height:1.6}
  .hello{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .hello b{font-size:20px}
  .linkbtn{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 14px;font-size:14px;cursor:pointer;color:var(--muted);font-family:inherit}
  .me-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .me-chip{border:2px solid var(--accent);background:#fff;color:var(--accent);border-radius:99px;padding:10px 16px;
    font-size:17px;font-weight:800;cursor:pointer;font-family:inherit}

  #modal{position:fixed;inset:0;background:rgba(40,30,25,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20}
  #modal[hidden]{display:none}
  .sheet{background:#fff;width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:18px 16px 26px;max-height:92vh;overflow:auto}
  .sheet h2{margin:0;font-size:24px}
  .sheet h2 small{display:block;font-size:14px;color:var(--muted);font-weight:600;margin-top:2px}
  .pills{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 4px}
  .pill{font-size:13px;font-weight:700;padding:4px 10px;border-radius:99px;background:#f3ece4;color:var(--muted)}
  .pill.on{background:var(--ok-soft);color:var(--ok-dark)}
  .pill.on2{background:var(--ok-deep);color:var(--ok-dark)}
  .pill.bad{background:var(--warn-soft);color:var(--warn)}
  .btn{width:100%;padding:15px;font-size:18px;font-weight:800;border-radius:14px;border:2px solid var(--line);
    margin-top:10px;cursor:pointer;background:#fff;color:var(--ink);font-family:inherit}
  .btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
  .btn.deep{background:var(--ok-dark);border-color:var(--ok-dark);color:#fff}
  .btn.warn{background:var(--warn);border-color:var(--warn);color:#fff}
  .btn.line{border-color:var(--muted);color:var(--muted);font-size:16px;padding:12px}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .sec{margin-top:16px;padding-top:12px;border-top:1px dashed var(--line)}
  .sec h4{margin:0 0 6px;font-size:15px}
  .sec textarea{width:100%;min-height:76px;border:2px solid var(--line);border-radius:12px;padding:10px;font:inherit;font-size:16px;resize:vertical}
  .sec .cnt{font-size:12px;color:var(--muted);text-align:right}
  .sec .help{font-size:13px;color:var(--muted);margin:0 0 6px}
</style>
</head>
<body>
<header>
  <h1>🏫 考場布置進度板</h1>
  <div class="tabs">
    <button class="tab" id="tab-staff">布置人員</button>
    <button class="tab" id="tab-admin">總負責人</button>
  </div>
</header>
<main>
  <div class="status" id="status">連線中…</div>
  <div id="view"></div>
</main>
<div id="modal" hidden></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getFirestore, collection, doc, setDoc, onSnapshot, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBgO69052mbZ4RdGvL_GG2bcu0XD9NSN7I",
  authDomain: "fuhe-board.firebaseapp.com",
  projectId: "fuhe-board",
  storageBucket: "fuhe-board.firebasestorage.app",
  messagingSenderId: "515261096272",
  appId: "1:515261096272:web:2292468ac45bd85f24cc55"
};
const db = getFirestore(initializeApp(firebaseConfig));
const COL = "examRooms";

// [考場編號, 教室號碼]
const BUILDINGS = [
  { name: "福和樓", floors: [
    { name: "3、4 號樓梯側・四樓", rooms: [[18,811],[19,812],[20,804]] },
    { name: "3、4 號樓梯側・三樓", rooms: [[15,826],[16,827],[17,719]] },
    { name: "3、4 號樓梯側・二樓", rooms: [[1,708],[2,707],[3,828]] },
    { name: "斜棟・外側排", rooms: [[21,805],[22,806],[23,807]] },
    { name: "斜棟・內側排", rooms: [[12,822],[13,823],[14,824]] },
    { name: "2、1 號樓梯側・四樓", rooms: [[24,808],[25,809],[26,810],[27,813],[28,814],[29,815]] },
    { name: "2、1 號樓梯側・三樓", rooms: [[6,816],[7,817],[8,818],[9,819],[10,820],[11,821]] },
    { name: "2、1 號樓梯側・二樓", rooms: [[4,829],[5,825]] } ]},
  { name: "懿芳樓", floors: [
    { name: "四樓", rooms: [[30,720],[31,721],[32,722],[33,723],[34,724]] },
    { name: "三樓", rooms: [[35,714],[36,715],[37,716],[38,717],[39,718]] },
    { name: "二樓", rooms: [[40,709],[41,710],[42,711],[43,712]] } ]},
];

// 人員分工：[姓名, [考場編號或 [起,迄] 範圍...]]
const NAMES = ["素玉", "鍾綾", "筱婷", "國慧", "承勳", "子傑", "義彥", "曉曉主任"];
const OWNER_PLAN = [   // 負責布置
  ["素玉",     [[1,5]]],
  ["鍾綾",     [[6,11]]],
  ["筱婷",     [[12,17]]],
  ["國慧",     [[19,23]]],
  ["承勳",     [[24,29]]],
  ["子傑",     [18, [30,33]]],
  ["義彥",     [[34,38]]],
  ["曉曉主任", [[39,43]]],
];
const REVIEWER_PLAN = [  // 負責複查
  ["鍾綾",     [[1,5]]],
  ["素玉",     [[6,11]]],
  ["國慧",     [[12,17]]],
  ["筱婷",     [[19,23]]],
  ["子傑",     [[24,29]]],
  ["承勳",     [18, [30,33]]],
  ["曉曉主任", [[34,38]]],
  ["義彥",     [[39,43]]],
];
function expand(plan) {
  const m = {};
  plan.forEach(([name, items]) => items.forEach(x => {
    if (Array.isArray(x)) for (let i = x[0]; i <= x[1]; i++) m[i] = name; else m[x] = name;
  }));
  return m;
}
const OWNER = expand(OWNER_PLAN), REVIEWER = expand(REVIEWER_PLAN);

const ALL = BUILDINGS.flatMap(b => b.floors.flatMap(f => f.rooms.map(r => r[0])));
const TOTAL = ALL.length;
const CLASS_OF = {}, LOC_OF = {};
BUILDINGS.forEach(b => b.floors.forEach(f => f.rooms.forEach(([no, cls]) => {
  CLASS_OF[no] = cls; LOC_OF[no] = b.name + " " + f.name;
})));
const MAX_NOTE = 200;

let rooms = {};                       // { "考場編號": {done, checked, issue} }
let mode = location.hash === "#admin" ? "admin" : "staff";
let modalNo = null, draft = "";
let me = "";
try { me = localStorage.getItem("examMe") || ""; } catch (e) {}
if (!NAMES.includes(me)) me = "";
function setMe(n) {
  me = NAMES.includes(n) ? n : "";
  try { if (me) localStorage.setItem("examMe", me); else localStorage.removeItem("examMe"); } catch (e) {}
}
const $ = id => document.getElementById(id);
const view = $("view"), statusEl = $("status"), modal = $("modal");
const R = no => rooms[String(no)] || { done: false, checked: false, issue: "" };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

function setStatus(text, err) { statusEl.textContent = text; statusEl.className = "status" + (err ? " err" : ""); }

onSnapshot(collection(db, COL), snap => {
  rooms = {};
  snap.forEach(d => {
    const v = d.data();
    rooms[d.id] = { done: !!v.done, checked: !!v.checked, issue: typeof v.issue === "string" ? v.issue : "" };
  });
  setStatus("✅ 已連線，畫面會自動更新");
  render();
}, err => {
  console.error(err);
  setStatus("⚠️ 連線失敗，請檢查網路（或 Firestore 規則）：" + err.code, true);
});

async function save(no, patch) {
  const key = String(no), prev = rooms[key];
  rooms[key] = { ...R(no), ...patch };
  render();                           // 先更新畫面，感覺比較即時
  try {
    await setDoc(doc(db, COL, key), { ...patch, updatedAt: serverTimestamp() }, { merge: true });
  } catch (e) {
    console.error(e);
    if (prev) rooms[key] = prev; else delete rooms[key];
    render();
    alert("儲存失敗，請確認網路後再試一次。（" + (e.code || "") + "）");
  }
}

/* ---------- 操作視窗 ---------- */
function openModal(no) { modalNo = no; draft = R(no).issue; renderModal(); }
function closeModal() { modalNo = null; renderModal(); }

function renderModal() {
  if (modalNo == null) { modal.hidden = true; modal.innerHTML = ""; return; }
  const no = modalNo, r = R(no);
  modal.hidden = false;
  modal.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">
    <h2>考場 ${no}<small>${CLASS_OF[no]} 教室 ・ ${esc(LOC_OF[no])}</small>
      <small>布置：${esc(OWNER[no])}　複查：${esc(REVIEWER[no])}</small></h2>
    <div class="pills">
      <span class="pill ${r.done ? "on" : ""}">${r.done ? "✓ 已完成" : "尚未完成"}</span>
      <span class="pill ${r.checked ? "on2" : ""}">${r.checked ? "✓✓ 已複查" : "尚未複查"}</span>
      ${r.issue ? `<span class="pill bad">⚠ 有狀況</span>` : ""}
    </div>
    ${r.done
      ? `<button class="btn line" id="b-done">取消「完成」</button>`
      : `<button class="btn ok" id="b-done">✓ 布置完成</button>`}
    ${r.checked
      ? `<button class="btn line" id="b-check">取消「已複查」</button>`
      : `<button class="btn deep" id="b-check" ${r.done ? "" : "disabled"}>✓✓ 已複查${r.done ? "" : "（需先完成）"}</button>`}
    <div class="sec">
      <h4>⚠ 現場有狀況</h4>
      <p class="help">例如：投影機壞掉、少一張桌子、冷氣不冷。總負責人會立刻看到。</p>
      <textarea id="note" maxlength="${MAX_NOTE}" placeholder="請簡單描述狀況…">${esc(draft)}</textarea>
      <div class="cnt" id="cnt">${draft.length} / ${MAX_NOTE}</div>
      <button class="btn warn" id="b-issue">${r.issue ? "更新狀況說明" : "回報狀況"}</button>
      ${r.issue ? `<button class="btn ok" id="b-clear">狀況已排除</button>` : ""}
    </div>
    <button class="btn line" id="b-close" style="margin-top:16px">關閉</button>
  </div>`;

  const done = $("b-done"), check = $("b-check"), issue = $("b-issue"), clear = $("b-clear"), note = $("note");
  done.onclick = () => {
    if (r.done) {
      if (!confirm(r.checked ? "取消完成會一併取消「已複查」，確定嗎？" : "確定要取消「完成」嗎？")) return;
      save(no, { done: false, checked: false });
    } else save(no, { done: true });
    closeModal();
  };
  check.onclick = () => { if (!r.done && !r.checked) return; save(no, { checked: !r.checked }); closeModal(); };
  note.oninput = () => { draft = note.value; $("cnt").textContent = draft.length + " / " + MAX_NOTE; };
  issue.onclick = () => {
    const t = note.value.trim().slice(0, MAX_NOTE);
    if (!t) { alert("請先寫一下是什麼狀況喔。"); return; }
    save(no, { issue: t }); closeModal();
  };
  if (clear) clear.onclick = () => { save(no, { issue: "" }); closeModal(); };
  $("b-close").onclick = closeModal;
}
modal.addEventListener("click", e => { if (e.target === modal) closeModal(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && modalNo != null) closeModal(); });

/* ---------- 畫面 ---------- */
const countOf = (nos, key) => nos.filter(no => R(no)[key]).length;
const countIssue = nos => nos.filter(no => R(no).issue).length;
const roomsOf = b => b.floors.flatMap(f => f.rooms.map(r => r[0]));
const waiting = no => (R(no).done && !R(no).checked) ? 1 : 0;

function roomBtn(no) {
  const s = R(no);
  const stText = s.checked ? "✓✓ 已複查" : s.done ? "✓ 已完成，待複查" : "尚未完成";
  return `<button class="room${s.done ? " done" : ""}${s.checked ? " checked" : ""}${s.issue ? " issue" : ""}" data-no="${no}">
    ${s.issue ? `<span class="flag">⚠️</span>` : ""}
    <div class="no">考場<b>${no}</b></div>
    <div class="cls">${CLASS_OF[no]} 教室</div>
    <div class="st">${stText}</div>
    <div class="who">布置 ${esc(OWNER[no])}<br>複查 ${esc(REVIEWER[no])}</div>
    ${s.issue ? `<div class="note">${esc(s.issue)}</div>` : ""}</button>`;
}

function grid() {
  return BUILDINGS.map(b => {
    const rs = roomsOf(b);
    return `<div class="card"><div class="bld">${b.name}<small>完成 ${countOf(rs, "done")}／複查 ${countOf(rs, "checked")}／共 ${rs.length}</small></div>` +
      b.floors.map(f => `<div class="floor"><h3>${f.name}</h3><div class="rooms">${f.rooms.map(r => roomBtn(r[0])).join("")}</div></div>`).join("") +
      `</div>`;
  }).join("");
}

function statsCard() {
  const n = countOf(ALL, "done"), k = countOf(ALL, "checked"), p = countIssue(ALL);
  return `<div class="card"><div class="stats">
      <div class="stat"><div class="big">${n}</div><div class="sub">已完成 / ${TOTAL}</div></div>
      <div class="stat c2"><div class="big">${k}</div><div class="sub">已複查 / ${TOTAL}</div></div>
      <div class="stat c3${p ? "" : " zero"}"><div class="big">${p}</div><div class="sub">有狀況</div></div>
    </div>
    <div class="bar"><i style="width:${Math.round(n / TOTAL * 100)}%"></i><i class="b2" style="width:${Math.round(k / TOTAL * 100)}%"></i></div></div>`;
}

function pickNameCard() {
  return `<div class="card me"><b style="font-size:18px">👋 你是哪一位？</b>
    <p class="hint" style="margin:6px 0 0">選一下名字，下次打開就會記得，並且先顯示你負責的考場。</p>
    <div class="me-chips">${NAMES.map(n => `<button class="me-chip" data-me="${esc(n)}">${esc(n)}</button>`).join("")}</div></div>`;
}

function mySection() {
  const own = ALL.filter(no => OWNER[no] === me).sort((a, b) => a - b);
  const rev = ALL.filter(no => REVIEWER[no] === me).sort((a, b) => (waiting(b) - waiting(a)) || (a - b));
  const w = rev.filter(waiting).length;
  return `<div class="card me">
    <div class="hello"><span>👋 嗨，<b>${esc(me)}</b></span><button class="linkbtn" data-me="">換人</button></div>
    <div class="floor"><h3>🛠 我負責布置：${countOf(own, "done")} / ${own.length} 完成</h3>
      <div class="rooms">${own.map(roomBtn).join("") || "<span class='hint'>沒有</span>"}</div></div>
    <div class="floor"><h3>🔍 我負責複查：${countOf(rev, "checked")} / ${rev.length} 已複查${w ? `，有 ${w} 間等你複查` : ""}</h3>
      <div class="rooms">${rev.map(roomBtn).join("") || "<span class='hint'>沒有</span>"}</div></div>
  </div>`;
}

function peopleCard() {
  return `<div class="card"><div class="bld">各負責人進度</div><div class="bsum" style="margin-top:8px">` +
    NAMES.map(n => {
      const own = ALL.filter(no => OWNER[no] === n), rev = ALL.filter(no => REVIEWER[no] === n);
      const d = countOf(own, "done"), k = countOf(rev, "checked"), w = rev.filter(waiting).length;
      const iss = countIssue(own);
      return `<div class="it${d === own.length && k === rev.length ? " full" : ""}"><b><span>${esc(n)}</span><span>布置 ${d}/${own.length}</span></b>
        <div class="bar" style="height:8px;margin-top:6px"><i style="width:${Math.round(d / own.length * 100)}%"></i></div>
        <small>複查 ${k}/${rev.length}${w ? `・等待複查 ${w} 間` : ""}${iss ? `・⚠️ ${iss} 間有狀況` : ""}</small></div>`;
    }).join("") + `</div></div>`;
}

function render() {
  $("tab-staff").classList.toggle("on", mode === "staff");
  $("tab-admin").classList.toggle("on", mode === "admin");

  if (mode === "staff") {
    view.innerHTML = (me ? mySection() : pickNameCard()) +
      `<p class="hint" style="margin-top:4px">點一下考場，就能按「布置完成」；複查人員按「已複查」；現場有問題請按「回報狀況」。</p>` +
      statsCard() + `<h3 class="allh">全部考場</h3>` + grid();
  } else {
    const sorted = ALL.slice().sort((a, b) => a - b);
    const todo = sorted.filter(no => !R(no).done);
    const unchecked = sorted.filter(waiting);
    const issues = sorted.filter(no => R(no).issue);
    view.innerHTML =
      statsCard() +
      (issues.length ? `<div class="card alert"><div class="bld" style="color:var(--warn)">⚠️ 有狀況的考場<small>${issues.length} 間</small></div><div class="issues">` +
        issues.map(no => `<div class="iss" data-no="${no}"><b>考場${no}（${CLASS_OF[no]}）・${esc(OWNER[no])}</b>　${esc(R(no).issue)}</div>`).join("") + `</div></div>` : "") +
      peopleCard() +
      `<div class="card"><div class="bld">各棟進度</div><div class="bsum" style="margin-top:8px">` +
      BUILDINGS.map(b => { const rs = roomsOf(b), c = countOf(rs, "done"), k = countOf(rs, "checked");
        return `<div class="it${k === rs.length ? " full" : ""}"><b><span>${b.name}</span><span>${c}/${rs.length}</span></b>
          <div class="bar" style="height:8px;margin-top:6px"><i style="width:${Math.round(c / rs.length * 100)}%"></i><i class="b2" style="width:${Math.round(k / rs.length * 100)}%"></i></div>
          <small>已複查 ${k}/${rs.length}</small></div>`; }).join("") +
      `</div></div>` +
      `<div class="card"><div class="bld">尚未完成<small>${todo.length} 間</small></div>` +
      (todo.length ? `<div class="todo">${todo.map(no => `<span class="chip" data-no="${no}">考場${no}（${CLASS_OF[no]}）${esc(OWNER[no])}</span>`).join("")}</div>`
        : `<p style="margin:8px 0 0">🎉 全部考場都布置完成了！</p>`) + `</div>` +
      `<div class="card"><div class="bld">已完成、等待複查<small>${unchecked.length} 間</small></div>` +
      (unchecked.length ? `<div class="todo">${unchecked.map(no => `<span class="chip g" data-no="${no}">考場${no}（${CLASS_OF[no]}）${esc(REVIEWER[no])}</span>`).join("")}</div>`
        : `<p style="margin:8px 0 0;color:var(--muted)">目前沒有。</p>`) + `</div>` +
      grid();
  }
  // 正在輸入狀況說明時，不重畫視窗，避免打字被打斷
  if (modalNo != null && document.activeElement && document.activeElement.id === "note") return;
  renderModal();
}

view.addEventListener("click", e => {
  const m = e.target.closest("[data-me]");
  if (m) { setMe(m.dataset.me); render(); return; }
  const el = e.target.closest("[data-no]");
  if (el) openModal(Number(el.dataset.no));
});
function setMode(m) { mode = m; history.replaceState(null, "", m === "admin" ? "#admin" : "#staff"); render(); window.scrollTo(0, 0); }
$("tab-staff").onclick = () => setMode("staff");
$("tab-admin").onclick = () => setMode("admin");
render();
</script>
</body>
</html>
